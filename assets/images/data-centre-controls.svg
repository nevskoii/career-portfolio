<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" role="img" aria-label="DATA CENTRE CONTROLS"><rect width="1300" height="820" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#223d53}.ttl{font-size:21px;font-weight:700;fill:#fff}.sub{font-size:12px;fill:#d8e8f2}.name{font-size:14px;font-weight:700}.desc{font-size:11px;fill:#526c80}.foot{font-size:13px;fill:#426079}</style><rect x="492" y="328" width="316" height="142" rx="15" fill="#143e5c"/><text class="ttl" x="650" y="370" text-anchor="middle">DATA CENTRE CONTROLS</text><text class="sub" x="650" y="398" text-anchor="middle">Reliability, security &amp; operational resilience</text><path d="M460 76 C 482 76,470 360,492 360" fill="none" stroke="#3977a3" stroke-width="2" opacity=".7"/><rect x="22" y="20" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#3977a3" stroke-width="1.3"/><text class="name" x="35" y="45">1. DC Operations</text><text class="desc" x="36" y="68">• Environment and uptime monitoring</text><text class="desc" x="36" y="84">• Maintenance and capacity review</text><path d="M460 224 C 482 224,470 380,492 380" fill="none" stroke="#3977a3" stroke-width="2" opacity=".7"/><rect x="22" y="168" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#3977a3" stroke-width="1.3"/><text class="name" x="35" y="193">2. Construction &amp; Commissioning</text><text class="desc" x="36" y="216">• Design, budget and vendor review</text><text class="desc" x="36" y="232">• Acceptance tests and handover</text><path d="M460 372 C 482 372,470 400,492 400" fill="none" stroke="#3977a3" stroke-width="2" opacity=".7"/><rect x="22" y="316" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#3977a3" stroke-width="1.3"/><text class="name" x="35" y="341">3. Access &amp; Physical Security</text><text class="desc" x="36" y="364">• Access approval and visitor logs</text><text class="desc" x="36" y="380">• CCTV, least privilege, review</text><path d="M460 520 C 482 520,470 420,492 420" fill="none" stroke="#3977a3" stroke-width="2" opacity=".7"/><rect x="22" y="464" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#3977a3" stroke-width="1.3"/><text class="name" x="35" y="489">4. Incident Management</text><text class="desc" x="36" y="512">• Incident severity, RCA, escalation</text><text class="desc" x="36" y="528">• Problem management and CAP tracking</text><path d="M460 668 C 482 668,470 440,492 440" fill="none" stroke="#3977a3" stroke-width="2" opacity=".7"/><rect x="22" y="612" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#3977a3" stroke-width="1.3"/><text class="name" x="35" y="637">5. IT Infrastructure</text><text class="desc" x="36" y="660">• Configuration and patch management</text><text class="desc" x="36" y="676">• Backups, asset inventory</text><path d="M840 76 C 818 76,830 360,808 360" fill="none" stroke="#c48439" stroke-width="2" opacity=".7"/><rect x="840" y="20" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#c48439" stroke-width="1.3"/><text class="name" x="853" y="45">6. Power &amp; Cooling</text><text class="desc" x="854" y="68">• UPS and generator maintenance</text><text class="desc" x="854" y="84">• PUE and energy monitoring</text><path d="M840 224 C 818 224,830 380,808 380" fill="none" stroke="#c48439" stroke-width="2" opacity=".7"/><rect x="840" y="168" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#c48439" stroke-width="1.3"/><text class="name" x="853" y="193">7. Fire &amp; Environment</text><text class="desc" x="854" y="216">• Fire systems and environmental alerts</text><text class="desc" x="854" y="232">• Regular tests and inspections</text><path d="M840 372 C 818 372,830 400,808 400" fill="none" stroke="#c48439" stroke-width="2" opacity=".7"/><rect x="840" y="316" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#c48439" stroke-width="1.3"/><text class="name" x="853" y="341">8. Business Continuity</text><text class="desc" x="854" y="364">• BCP, DRP, recovery testing</text><text class="desc" x="854" y="380">• RTO/RPO, critical vendors</text><path d="M840 520 C 818 520,830 420,808 420" fill="none" stroke="#c48439" stroke-width="2" opacity=".7"/><rect x="840" y="464" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#c48439" stroke-width="1.3"/><text class="name" x="853" y="489">9. Third-party Management</text><text class="desc" x="854" y="512">• Supplier risk and SLA review</text><text class="desc" x="854" y="528">• Compliance checks and audit follow-up</text><path d="M840 668 C 818 668,830 440,808 440" fill="none" stroke="#c48439" stroke-width="2" opacity=".7"/><rect x="840" y="612" width="438" height="115" rx="10" fill="#f8fbfd" stroke="#c48439" stroke-width="1.3"/><text class="name" x="853" y="637">10. Risk &amp; Governance</text><text class="desc" x="854" y="660">• Risk assessments and reporting</text><text class="desc" x="854" y="676">• Policy, audit, compliance monitoring</text><rect x="220" y="777" width="860" height="30" rx="5" fill="#edf4f8"/><text class="foot" x="650" y="797" text-anchor="middle">ITIL · ISO/IEC 27000 series · Business Continuity · Monitoring · Documentation</text></svg>